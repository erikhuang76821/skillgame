<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Portrait-only (gdd/10): no landscape layout exists; desktop shows the same portrait column. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e1620">
  <meta name="screen-orientation" content="portrait">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Swarm%20Duel%22%2C%22display%22%3A%22fullscreen%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%230e1620%22%7D">
  <title>Swarm Duel: Cryptid Camp</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1620; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    /* Desktop / wide screens: blurred key art fills the side bands around the portrait column. */
    body::before { content: ''; position: fixed; inset: -48px; background: var(--bg, none) center / cover no-repeat;
      filter: blur(28px) brightness(0.4) saturate(1.1); }
    #app { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas { image-rendering: pixelated; display: block; position: relative; box-shadow: 0 0 60px rgba(0, 0, 0, 0.6); }
    #safe { position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #rotate { position: fixed; inset: 0; display: none; place-content: center; gap: 16px; text-align: center;
      background: #0e1620; color: #e7eef5; font: 700 20px/1.4 "Trebuchet MS", system-ui, sans-serif; z-index: 2; }
    #rotate svg { margin: 0 auto; }
    /* Phones/tablets held sideways: we do not design a landscape layout, ask to rotate instead. */
    @media (orientation: landscape) and (pointer: coarse) { #rotate { display: grid; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="safe"></div>
  <div id="rotate" role="alert">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#8ff03c" stroke-width="1.6" aria-hidden="true">
      <rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/><path d="M3 9a9 9 0 0 1 3-5M21 15a9 9 0 0 1-3 5"/>
    </svg>
    <div>Rotate your phone to portrait<br><small style="font-weight:400;color:#8ea1b2">Swarm Duel is played upright</small></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

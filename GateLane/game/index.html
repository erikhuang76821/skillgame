<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Gate Lane</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10161d; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; overscroll-behavior: none; color: #eef3f8;
      font: 700 16px/1.3 system-ui, "Noto Sans TC", sans-serif; }
    /* Layering: #stage (clips) > #stage-shake (shaken by GSAP) > canvas; #fx and #hud are siblings, never shaken. */
    #stage { position: fixed; inset: 0; overflow: hidden; background: #10161d; }
    #stage-shake { position: absolute; inset: -12px; will-change: transform; }
    #stage-shake canvas { position: absolute; inset: 12px; display: block; }
    #fx { position: fixed; inset: 0; pointer-events: none; }
    #fx-vignette, #fx-flash { position: absolute; inset: 0; opacity: 0; }
    #fx-vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(200, 0, 0, .65) 100%); }
    #fx-flash { background: #fff; mix-blend-mode: screen; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; justify-content: center; }
    #col { position: relative; height: 100%; width: min(100vw, 56.25vh);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; }
    .top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; }
    .score { font-size: 26px; text-shadow: 0 2px 0 #000; min-width: 80px; }
    .progress { flex: 1; height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
    .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4fc3ff, #8ff03c); }
    .weapon { font-size: 14px; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); }
    .boss { position: absolute; top: calc(48px + env(safe-area-inset-top)); left: 12px; right: 12px; height: 14px; border-radius: 7px;
      background: rgba(0,0,0,.5); border: 2px solid #ff5a4a; overflow: hidden; opacity: 0; transition: opacity .2s; }
    .boss > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b2f, #ff9a3c); transform-origin: left; }
    .dc { position: absolute; bottom: 8px; right: 10px; font: 11px/1 ui-monospace, monospace; opacity: .6; }
    .panel { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); text-align: center;
      padding: 22px 18px; border-radius: 18px; background: rgba(10, 16, 24, .82); border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .panel h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 1px; }
    .panel p { margin: 6px 0; opacity: .9; }
    .panel table { width: 100%; margin: 12px 0; border-collapse: collapse; font-size: 15px; }
    .panel td { padding: 3px 4px; }
    .panel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .panel .total td { border-top: 1px solid rgba(255,255,255,.25); font-size: 20px; padding-top: 8px; }
    .panel .hint { font-size: 14px; opacity: .7; }
    .win { color: #8ff03c; } .lose { color: #ff6b5a; }
  </style>
</head>
<body>
  <div id="stage"><div id="stage-shake"></div></div>
  <div id="fx" aria-hidden="true"><div id="fx-vignette"></div><div id="fx-flash"></div></div>
  <div id="hud"><div id="col">
    <div class="top">
      <div class="score">0</div>
      <div class="progress"><i></i></div>
      <div class="weapon">武器 Lv1</div>
    </div>
    <div class="boss"><i></i></div>
    <div class="dc" hidden></div>
    <div class="panel" id="panel"></div>
  </div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

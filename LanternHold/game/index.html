<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>守望之戰</title>
  <style>
    :root { --night: #141a33; --panel: rgba(16, 22, 44, .9); --line: rgba(255,255,255,.16); --lamp: #ffb64a;
      --gold: #f0c35a; --meat: #e07a5f; --ore: #8fb3d9; --ally: #6fd3c4; --danger: #ff5a5a; }
    html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; overscroll-behavior: none; color: #eef3f8;
      font: 700 15px/1.3 system-ui, "Noto Sans TC", sans-serif; }
    #stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
    #stage-shake { position: absolute; inset: -12px; will-change: transform; }
    #stage-shake canvas { position: absolute; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
    #fx { position: fixed; inset: 0; pointer-events: none; }
    #fx-vignette, #fx-flash { position: absolute; inset: 0; opacity: 0; }

    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; justify-content: center; }
    #col { position: relative; height: 100%; width: min(100vw, 56.25vh); }
    .top { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .time { margin-left: auto; }

    .xprow { position: absolute; top: calc(56px + env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; font-size: 13px; }

    .build .evo { background: rgba(143,240,255,.25) !important; border-color: #8ff0ff !important; color: #dffaff; }

    .banner { position: absolute; top: 24%; left: 16px; right: 16px; text-align: center; padding: 12px; border-radius: 14px; background: rgba(16,22,44,.88); border: 2px solid #6fd3c4; opacity: 0; }
    .banner b { display: block; font-size: 24px; } .banner small { display: block; font-weight: 500; opacity: .85; margin-top: 4px; }

    .cards h2 { margin: 0 0 12px; color: var(--lamp); font-size: 22px; } .cards h2 small { color: #eef3f8; opacity: .7; font-size: 14px; }

    .cardrow { display: flex; gap: 6px; align-items: stretch; }
    .cardrow .card { flex: 1; min-width: 0; }

    .card.evo { border-color: #8ff0ff; background: linear-gradient(160deg, #1d3a55, #1f2950); box-shadow: 0 0 24px rgba(143,240,255,.35); }
    .card.banning { border-color: var(--danger); }

    .tag.evo { --tc: #8ff0ff; }
    .cards .row { display: flex; gap: 8px; margin-top: 12px; }

    /* Reward / modal spec (gdd/02 §UI 彈窗): full dim backdrop, one centred panel, cards >= 120 x 170 with a 48 px icon,
       text >= 13 px, rarity colour on the border and value, one primary button; banners and combo text hidden meanwhile. */
    .chest { background: rgba(6,8,20,.86); display: none; padding: 0 12px; }
    .chest .rw-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 24px));
      padding: 18px 14px 16px; border-radius: 18px; background: linear-gradient(180deg, #26305c, #161c3a); border: 2px solid #d8c39a;

    .chest .rw-head p { margin: 4px 0 12px; font-size: 13px; opacity: .8; }
    .chest .rw-cards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; perspective: 600px; }
    .rw-card { --rc: #d8c39a; width: 124px; min-height: 172px; padding: 12px 8px 10px; border-radius: 14px; background: #1c2448; border: 2px solid var(--rc);

    .rw-card .rw-rar { font-size: 12px; color: var(--rc); border: 1px solid var(--rc); border-radius: 8px; padding: 0 6px; }
    .rw-card small { font-size: 13px; line-height: 1.35; opacity: .85; }
    .rw-card.evo { --rc: #8ff0ff; }
    .chest .rw-go { margin-top: 14px; min-width: 160px; min-height: 46px; border-radius: 12px; border: 1px solid #d8c39a; background: #3a3a22; color: #fff2c0; font: inherit; font-size: 17px; }

    .hud-tl .xpbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #6fd3c4, #bff7ee); transform-origin: left; transform: scaleX(0); }
    .hud-tl .castlebar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff8a3d, var(--lamp)); transform-origin: left; }
    .hud-tr { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; width: 124px; display: flex; flex-direction: column; gap: 3px; align-items: stretch; }

    .skills { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
    .skills .sk { position: relative; width: 40px; height: 40px; border-radius: 9px; background: rgba(16,22,44,.85); border: 1px solid var(--line); display: grid; place-items: center; }
    .skills .sk.evo { border-color: #8ff0ff; box-shadow: 0 0 10px rgba(143,240,255,.5); }
    .skills .sk.evo.todo { border-color: var(--line); box-shadow: none; opacity: .8; }
    .skills .sk.evo.todo i { filter: grayscale(.7); }
    .skills .sk b { position: absolute; right: -2px; bottom: -4px; font-size: 11px; background: #24305a; border-radius: 6px; padding: 0 3px; }
    .cards .hand { display: flex; flex-direction: row; gap: 6px; align-items: stretch; }
    .cardcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .cardcol .card { flex: 1; text-align: center; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; }
    .cardcol .card .ico { float: none; margin: 2px 0 4px; }
    .cardcol .card h4 { font-size: 16px; } .cardcol .card p { font-size: 12px; } .cardcol .card .tags .tag { font-size: 10px; margin: 1px; padding: 0 4px; }

    .cardcol .side button { flex: 1; min-height: 36px; border-radius: 9px; border: 1px solid var(--line); background: #24305a; color: inherit; font: inherit; font-size: 12px; }

    .cardcol .side .ign:not(:disabled) { border-color: #ff9a9a; } .cardcol .side .lck:not(:disabled) { border-color: var(--lamp); }
    .cards .row { justify-content: center; } .cards .row button { flex: 0 1 220px; }

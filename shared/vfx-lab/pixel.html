<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VFX Lab · 像素戰鬥特效</title>
<style>
  :root { color-scheme: dark; --bg:#0d1218; --panel:#151d26; --line:#263241; --text:#d9e4ee; --dim:#8296a8; --acc:#ffb627; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display:grid; gap:12px; }
  h1 { font-size: 18px; margin: 0; } h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  a { color: var(--acc); }
  #wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; background:#07090d; position:relative; }
  #stage { position:relative; width:max-content; margin:0 auto; }
  /* 像素銳利：canvas 以原生像素顯示（不經 CSS 非整數縮放），放大只在 Pixi 內做整數倍 nearest */
  #stage canvas { display:block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .tag { position:absolute; font: 12px ui-monospace, Consolas, monospace; color: var(--dim); background: #0009; padding: 1px 6px; border-radius: 4px; pointer-events:none; }
  .tag b { color: var(--text); font-weight: 600; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  button, select { background:#1f2b38; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color: var(--acc); }
  label { display:inline-flex; gap:6px; align-items:center; color:var(--dim); }
  input[type=range] { accent-color: var(--acc); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  #stats { color: var(--text); }
  #verdict.ok { color:#7be08f; } #verdict.bad { color:#ff7b7b; }
  .hint { color: var(--dim); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>像素戰鬥特效 <small>程式重做 × 6（參考 Pixel Composer Gallery）· knowledge-base/20 · <a href="./index.html">冰矢</a></small></h1>
  <div id="wrap"><div id="stage"></div></div>
  <div class="panel">
    <button id="play">⏸ 暫停</button>
    <label>速度 <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select></label>
    <label>倍率 <select id="scale"><option>2</option><option>3</option><option selected>4</option><option>5</option></select></label>
    <label>種子 <input id="seed" type="number" value="1" min="1" style="width:5em" /></label>
    <label>壓力 ×<input id="stress" type="range" min="1" max="40" value="1" /> <span id="stressOut" class="mono">1</span></label>
    <label><input type="checkbox" id="force" /> 每幀強制重算（不吃步進快取）</label>
  </div>
  <div class="panel">
    <span id="stats" class="mono">—</span>
    <span id="verdict" class="mono"></span>
  </div>
  <p class="hint">每格 64×64 低解析 buffer，最亮者勝、alpha 只有 0/255；整張 atlas 一張貼圖、一個 Sprite，以整數倍 nearest 放大。特效按自己的幀率步進（12–20 fps），只有換格時才重算。「壓力」= 每次換格額外重算 N 份不同種子（量 CPU 成本，不顯示）。烘成 PNG：<code>npm run bake</code>。</p>
</main>
<script type="module" src="./src/pixel/main.js"></script>
</body>
</html>

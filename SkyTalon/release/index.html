      <div class="boss" hidden><i></i></div>
      <div class="banner" hidden></div>
      <div class="dc" hidden></div>
      <div class="toggles">
        <button id="btn-low" type="button" aria-pressed="true">特效</button>
        <button id="btn-mute" type="button" aria-pressed="true">音效</button>
      </div>

      <section class="panel" id="panel-title">
        <h1>鷹爪航線</h1>
        <div class="sub">機體會自動開火，你只管飛。</div>
        <ul>
          <li><b>擊破</b>：每架有基礎分；連續擊破不被打中，每架再加 2 分 × 連鎖數（最多加 40）。</li>
          <li><b>擦彈</b>：敵彈擦身而過，每顆 2 分。</li>
          <li><b>頭目</b>：打掉 1000 分，越早打掉加越多（最多 300）。</li>
          <li><b>護盾</b>：共 3 格，被打中少 1 格、連鎖歸零；結束時每格 150 分。</li>
          <li>判定只有機身中央的亮點。同一題每個人遇到的敵機完全相同。</li>
        </ul>
        <div class="sub">手機：手指拖曳，機體會飛到手指上方。電腦：方向鍵或 WASD。</div>
        <div class="go">點一下開始</div>
      </section>

      <section class="panel" id="panel-result" hidden>
        <h2></h2>
        <div class="rows"></div>
        <div class="sum"><span>總分</span><span class="total">0</span></div>
        <div class="meta"><span class="best"></span><span class="verify" role="status"></span></div>
        <div class="actions">
          <button id="btn-retry" type="button" class="primary">同一題再飛</button>
          <button id="btn-next" type="button">換一題</button>
        </div>
        <div class="actions playtest" hidden>
          <button id="btn-export" type="button">匯出試玩紀錄</button>
        </div>
        <div class="sub playtest-note" hidden></div>
      </section>
    </div>
  </div>
</body>
</html>
